<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nem a Pato</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --primary: #fbbf24;
        --text: #e5e7eb;
        --muted: #94a3b8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        width: min(90vw, 700px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(251, 191, 36, 0.4);
        border-radius: 18px;
        padding: 40px 30px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 16px;
        color: var(--primary);
        font-size: clamp(2rem, 5vw, 4rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Nem a Pato</h1>
      <p>Bem-vindo ao repositório inicial do projeto.</p>
    </main>
  </body>
</html>
