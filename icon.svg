  <circle cx="420" cy="90" r="28" fill="#243B64"/>
  <circle cx="90" cy="420" r="20" fill="#243B64"/>

  <!-- Ponto de interrogação -->
  <text x="385" y="175"
        font-family="Arial, sans-serif"
        font-size="120"
        font-weight="bold"
        fill="#FFFFFF"
